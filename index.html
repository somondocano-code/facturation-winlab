
            <label for="clientCourriel">Courriel du Client :</label>
            <input type="email" id="clientCourriel" placeholder="Ex: client@courriel.com">
          </div>
          <div class="form-group">
            <label for="clientTelephone">Téléphone du Client :</label>
            <input type="tel" id="clientTelephone" placeholder="Ex: (450) 000-0000">
          </div>

          <div style="margin-top: 20px; margin-bottom: 10px;">
            <label style="font-size: 15px; color: #007bff; display: block; border-bottom: 1px solid #dee2e6; padding-bottom: 5px; margin-bottom: 15px;">🛠️ Travaux et Réparations</label>
            <div id="contenedorReparaciones"></div>
            <button type="button" class="btn-primary" style="background-color: #007bff; margin-top: 15px; padding: 10px 15px; font-size: 14px; width: auto;" onclick="agregarFilaReparacion()">➕ Ajouter une autre réparation</button>
          </div>

          <button type="submit" class="submit-btn" style="margin-top: 20px;">💾 Encaisser & Afficher Facture</button>
        </form>
      </div>
    </div>

    <!-- Pestaña de Caja e Historial -->
    <div id="caisse" class="tab-content" style="display: none;">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-val" id="totalCaisseDia">$0.00</div>
          <div class="stat-lbl">Chiffre d'affaires total</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="totalFacturesContador">0</div>
          <div class="stat-lbl">Factures émises</div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">📋 Liste des Factures Enregistrées</div>
        <div style="overflow-x: auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>Facture</th>
                <th>Client</th>
                <th>Appareils / Réparations</th>
                <th>Total</th>
                <th style="text-align: center;">Action</th>
              </tr>
            </thead>
            <tbody id="listaFacturesBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Pestaña de Inventario -->
    <div id="inventarioTab" class="tab-content" style="display: none;">
      <div class="card" style="margin-bottom: 25px;">
        <div class="card-header">📦 Ajouter une pièce / composant</div>
        <form id="formInventaire" onsubmit="guardarInventarioReal(event)" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; padding: 15px;">
          <div class="form-group">
            <label for="invNom">Nom de la pièce :</label>
            <input type="text" id="invNom" placeholder="Ex: Écran iPhone 13 Pro" list="modelesList" required>
          </div>
          <div class="form-group">
            <label for="invStock">Quantité en Stock :</label>
            <input type="number" id="invStock" placeholder="Ex: 10" min="0" required>
          </div>
          <div class="form-group">
            <label for="invMin">Stock Minimum (Alerte) :</label>
            <input type="number" id="invMin" placeholder="Ex: 2" min="0" required>
          </div>
          <div class="form-group">
            <label for="invCout">Prix de Coût (CAD) :</label>
            <input type="number" id="invCout" step="0.01" min="0" placeholder="0.00" required>
          </div>
          <div class="form-group">
            <label for="invVente">Prix de Vente (CAD) :</label>
            <input type="number" id="invVente" step="0.01" min="0" placeholder="0.00" required>
          </div>
          <div class="form-group" style="display: flex; align-items: flex-end;">
            <button type="submit" class="submit-btn" style="width: 100%; height: 42px; margin-top: 0; background-color: #10b981;">➕ Ajouter au stock</button>
          </div>
        </form>
      </div>

      <div class="card">
        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap;">
          <span>📋 Liste de l'Inventaire</span>
          <input type="text" id="buscadorInventario" oninput="filtrarInventario()" placeholder="🔍 Rechercher..." style="width: 100%; max-width: 200px; padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; font-size: 14px;">
        </div>
        <div style="overflow-x: auto;">
          <table class="data-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Nom de la pièce</th>
                <th style="text-align: center;">Stock</th>
                <th style="text-align: center;">Min</th>
                <th style="text-align: right;">Coût</th>
                <th style="text-align: right;">Vente</th>
                <th style="text-align: center;">Actions</th>
              </tr>
            </thead>
            <tbody id="listaInventarioBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <datalist id="modelesList">
    <option value="iPhone 17 Pro Max"></option>
    <option value="iPhone 16 Pro Max"></option>
    <option value="iPhone 15 Pro Max"></option>
    <option value="iPhone 14 Pro Max"></option>
    <option value="iPhone 13 Pro Max"></option>
    <option value="Galaxy S25 Ultra"></option>
  </datalist>

  <!-- MODAL DE VISTA PREVIA -->
  <div id="modalFactura" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <div class="modal-actions-bar">
        <button class="btn-secondary" style="background-color: #6c757d; color: white;" onclick="cerrarModal()">❌ Fermer</button>
        <button class="btn-primary" onclick="descargarFacturaPDF()">📥 Télécharger la Facture PDF</button>
      </div>
      <div id="modalCuerpoFactura" class="invoice-print-area"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
